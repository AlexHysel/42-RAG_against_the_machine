[project]
name = "42-rag-against-the-machine"
version = "1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "rank-bm25>=0.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
]
